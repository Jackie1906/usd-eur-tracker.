name: Update USD/EUR monthly rate

on:
  schedule:
    # Runs at 09:00 UTC on the 3rd of every month
    # (gives the ECB a couple of days to publish the new monthly average)
    - cron: "0 9 3 * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated CSV

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch latest ECB rate
        run: python3 fetch_rate.py

      - name: Commit and push if the CSV changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usd_eur_rates.csv
          git diff --cached --quiet || git commit -m "Update USD/EUR rate"
          git push
